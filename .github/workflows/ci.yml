name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # The tools-version 6.4 manifest needs Xcode 27 (Swift 6.4). `macos-26`
    # defaults to Xcode 26.x, so use the `xcode-27` image (macOS 27 + Xcode 27;
    # preview, may queue). Move to the GA macOS 27 label once GitHub ships it.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain info
        run: |
          sw_vers
          swift --version

      # Lint gate: swift-format (bundled) + SwiftLint. Ensure SwiftLint exists
      # (pre-installed on most runner images; install defensively otherwise).
      - name: Ensure SwiftLint
        run: swiftlint version || brew install swiftlint
      - name: Lint (format + SwiftLint)
        run: make lint

      # Pure-logic suite — channel classification, unit conversion, formatting.
      # Needs no SMC/IOReport hardware, so it runs on virtualized runners.
      - name: Run tests
        run: make test

      - name: Build (debug)
        run: make build

      # Also exercise the release bundling path (icon + .app assembly + ad-hoc
      # signing). Icon generation is best-effort; the app still builds without it.
      - name: Build app bundle
        run: make bundle

      - name: Verify app bundle
        run: |
          test -f dist/MacPower.app/Contents/MacOS/MacPower
          test -f dist/MacPower.app/Contents/Info.plist
          codesign -dv dist/MacPower.app
